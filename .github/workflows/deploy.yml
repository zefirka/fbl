# Builds the studio and publishes it to GitHub Pages.
#
# Datasets are not committed: FactorioLab serves them with CORS open, so the browser fetches
# them at run time and CI only needs a copy for the tests. The sprite atlas is committed, but
# to the `assets` branch rather than to `main` — it cannot be built here, and 12MB has no
# business in the history of every clone of the source.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tests read the datasets and the atlas off disk, so both have to be here even
      # though only one of them is deployed from this checkout.
      - name: Fetch game data
        run: npm run fetch-data

      # The sprite atlas cannot be built here — the extractor reads the game's own PNGs — so it
      # lives on the `assets` branch instead of weighing down every clone of the source.
      - name: Fetch the sprite atlas
        run: |
          git fetch --depth 1 origin assets
          git checkout FETCH_HEAD -- public/sprites
          du -sh public/sprites

      - name: Test
        run: npm test

      # Vite copies public/ verbatim. Shipping a second copy of Wube's icon art would be both
      # pointless and rude when FactorioLab already serves it with CORS open.
      - name: Drop the datasets before building
        run: rm -rf public/data && mkdir -p public/data && touch public/data/.gitkeep

      - name: Build
        run: npm run build

      # `enablement` turns Pages on the first time, so no manual trip to Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
