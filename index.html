<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fbl — a language for Factorio blueprints</title>
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <span class="brand">fbl<span class="brand-dim">/studio</span></span>

        <label class="field">
          <span>example</span>
          <select id="example"></select>
        </label>

        <label class="field">
          <span>version</span>
          <select id="version"></select>
        </label>

        <span class="spacer"></span>

        <span id="stats" class="stats"></span>
        <div class="segmented" id="view">
          <button type="button" data-mode="sprites" class="active">sprites</button>
          <button type="button" data-mode="schematic">schematic</button>
        </div>
        <button id="power" type="button" class="ghost" title="Show what the poles reach (P)">power</button>
        <button id="fit" type="button" class="ghost" title="Fit to view (F)">fit</button>
        <button id="copy" type="button" class="primary">copy blueprint</button>
      </header>

      <main class="panes">
        <section class="pane pane-editor"><div id="editor"></div></section>
        <div class="splitter" id="splitter" role="separator" aria-orientation="vertical"></div>
        <section class="pane pane-preview">
          <div class="tabs" id="tabs">
            <button type="button" data-tab="blueprint" class="active">blueprint</button>
            <button type="button" data-tab="docs">docs</button>
          </div>

          <div class="tab-body" id="tab-blueprint">
            <canvas id="canvas"></canvas>
            <div id="tooltip" class="tooltip" hidden></div>
            <aside id="cost" class="cost" hidden></aside>
            <div id="loading" class="loading">loading game data…</div>
          </div>

          <div class="tab-body" id="tab-docs" hidden><article id="docs" class="docs"></article></div>
        </section>
      </main>

      <footer id="console" class="console"></footer>
    </div>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
